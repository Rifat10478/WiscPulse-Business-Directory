{% extends "base.html" %}


{% block content %}


<div class="container mt-5">


    <div class="row justify-content-center">


        <div class="col-md-6">


            <div class="profile-card text-center">


                <div class="profile-avatar mx-auto mb-3">

                    {{ user.username|first|upper }}

                </div>


                <h2>

                    {{ user.username }}

                </h2>


                <p class="text-muted">

                    {{ user.email }}

                </p>


                <hr>


                <div class="text-start">


                    <p>

                        <strong>Username:</strong>

                        {{ user.username }}

                    </p>


                    <p>

                        <strong>Email:</strong>

                        {{ user.email }}

                    </p>


                </div>


            </div>


        </div>


    </div>


</div>


{% endblock %}
